name: nova-link
base: core24
version: '0.1.0'
summary: Fast, secure local peer-to-peer file sharing & pairing
description: |
  NOVA-Link seamlessly bridges Linux and Android devices over local Wi-Fi and 
  Tailscale VPN for encrypted file transfer, clipboard synchronization, and URL sharing.

grade: stable
confinement: strict

apps:
  nova-link:
    command: usr/bin/nova-desktop
    extensions: [gnome]
    desktop: usr/share/applications/com.novalink.NovaLink.desktop
    plugs:
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - home
      - removable-media

  daemon:
    command: usr/bin/nova-daemon
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - home

parts:
  desktop-entry:
    plugin: dump
    source: packaging
    organize:
      com.novalink.NovaLink.desktop: usr/share/applications/com.novalink.NovaLink.desktop

  nova-link:
    plugin: nil
    source: .
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - libssl-dev
      - pkg-config
    stage-packages:
      - libgtk-4-1
      - libadwaita-1-0
    override-build: |
      export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
      cargo build --release --workspace --features gui
      install -D -m 755 target/release/nova-desktop $CRAFT_PART_INSTALL/usr/bin/nova-desktop
      install -D -m 755 target/release/nova-daemon $CRAFT_PART_INSTALL/usr/bin/nova-daemon
