[package]
name = "nova-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Modern GTK4 + Libadwaita desktop UI frontend for NOVA-Link on Linux"

[dependencies]
nova-core = { path = "../core" }
tokio = { workspace = true, features = ["full", "net", "io-util"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dependencies.gtk4]
version = "0.8"
features = ["v4_12"]
optional = true

[dependencies.libadwaita]
version = "0.6"
features = ["v1_5"]
optional = true

[dependencies.glib]
version = "0.20"
optional = true

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita", "dep:glib"]
