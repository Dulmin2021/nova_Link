name: NOVA-Link Continuous Integration

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-core:
    name: Linux Rust Core & Daemons
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libavahi-client-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            linux/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('linux/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format Check
        run: cd linux && cargo fmt --all -- --check

      - name: Clippy Linting
        run: cd linux && cargo clippy --workspace -- -D warnings

      - name: Run Test Suites
        run: cd linux && cargo test --workspace --verbose

  android-app:
    name: Android App & Core Verification
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
